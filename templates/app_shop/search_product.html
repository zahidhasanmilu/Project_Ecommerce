{% extends "base.html" %}
{% load static %}
{% block title %}
Search By {{query}}
{% endblock title %}


{% block content %}


<div class="container">

  <div class="page-header text-center" style="background-image: url('{% static 'assets/images/page-header-bg.jpg' %}')">

    <h3 class="page-title">{{product.count}} product found from <span>
        <h2 style="color: brown;">{{query}}</h2>
      </span></h3>

  </div><!-- End .page-header -->


  <div class="row mt-3">
    {% for i in product %}
    <div class="col-lg-3">
      <div class="card" style="width: 25rem; ">

        <a href="{% url 'product_details' i.slug %}">
          <img src="{{i.image.url}}" class="card-img-top" alt="...">
        </a>
        <div class="card-body">
          <h5 class="card-title" style="height:80px">{{i.name}}</h5>
          <!-- <p class="card-text">Some quick example text to build on the card title and make up the bulk of the card's
            content.</p> -->
          <a href="{% url 'addtocart' i.pk %}" class="btn btn-primary">Add to cart</a>
        </div>
      </div>
    </div>
    {% endfor %}
  </div>


</div>
{% endblock content %}
